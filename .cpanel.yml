---
# Розгортання через cPanel → Git Version Control → «Deploy HEAD Commit».
#
# cPanel тримає власний клон репозиторію (не в public_html!) і, натиснувши
# «Розгорнути», виконує ці команди від імені користувача хостингу. Тобто git
# сюди нічого не «заливає» сам: команди нижче — це і є все розгортання.
#
# Чому rsync, а не «cp -R *», як у більшості прикладів:
#
#   • Зірочка не бачить файлів, що починаються з крапки. У цьому проєкті на них
#     тримається геть усе: кореневий .htaccess робить примусовий HTTPS і
#     маршрутизацію через index.php, а app/.htaccess, bin/.htaccess,
#     storage/.htaccess і assets/uploads/.htaccess закривають доступ до коду,
#     логів і завантажених файлів. Розгортання зірочкою дало б сайт, який не
#     маршрутизується і водночас віддає власний код.
#
#   • Сама документація cPanel застерігає від зірочки окремо: під неї
#     потрапляє й тека .git, а це вся історія проєкту у відкритому доступі.
#
# --delete тут навмисно немає. Він прибирав би з сервера файли, яких уже немає в
# репозиторії, — корисно, але поруч лежать завантажені фото товарів, яких у git
# не було ніколи. Помилка в одному рядку виключень коштувала б їх усіх. Стара
# копія файлу — проблема, яку видно й можна виправити; стерті фото — ні.
deployment:
  tasks:
    # Робоча тека сайту — як у bofu (public_html/bofu). Якщо домен магазину
    # дивиться в іншу теку, змініть шлях тут.
    - export DEPLOYPATH=$HOME/public_html/starvud
    - /bin/mkdir -p $DEPLOYPATH
    # ./ із скісною рискою — «вміст цієї теки», а не «тека всередину теки».
    # Без неї файли лягли б у public_html/starvud/starvud.
    - /usr/bin/rsync -a --exclude=.git --exclude=.gitignore --exclude=.cpanel.yml --exclude=tests --exclude=database --exclude=docker-compose.yml --exclude=.env.example --exclude=config.local.php ./ $DEPLOYPATH/
    # Права на саму теку сайту — і саме ПІСЛЯ rsync, це не дрібниця порядку.
    #
    # public_html належить користувачу, але групі nobody: через групу до нього
    # дістається веб-сервер. Підтеки ж успадковують групу користувача, тож на
    # теці сайту потрібен доступ для «інших», інакше сервер не може в неї
    # увійти — і повідомляє це як «File not found» на файл, який лежить на
    # місці й має правильні права.
    #
    # А режим цієї теки задає саме rsync: -a переносить права джерела, зокрема
    # й на теку призначення, а клон, який створює cPanel у repositories/, має
    # 0700. Тому chmod перед rsync не працює взагалі — rsync повертає 0700
    # назад, і сайт лягає рівно після успішного розгортання.
    - /bin/chmod 755 $DEPLOYPATH
    # Права на теки, у які пише сам сайт. Без -R і навмисно: рекурсія накрила б
    # і те, що всередині, а всередині storage лежать файли сесій — тобто діючі
    # входи в адмінку. Роздавати їм 755 означало б зробити чужі сесії читабельними
    # на рівні файлової системи. Самі файли створює PHP і виставляє їм 600.
    - /bin/chmod 755 $DEPLOYPATH/storage $DEPLOYPATH/assets/uploads
    - /bin/echo "Розгорнуто в $DEPLOYPATH — відкрийте сайт, схема бази оновиться сама"
